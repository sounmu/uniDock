      <p class="eyebrow">uniDock · 업데이트 완료</p>
      <h1>자막 진행 상태 유지</h1>
      <p class="version">버전 <span id="version"></span></p>
      <ul>
        <li><strong>탭을 옮겨도 이어지는 AI 자막</strong><p>확장 내부 메뉴나 브라우저의 다른 탭으로 이동해도 자막 작업이 취소되지 않습니다. 돌아오면 진행 상태와 완료된 결과를 그대로 확인할 수 있습니다.</p></li>
        <li><strong>감지한 자막 유지</strong><p>다른 탭을 선택해도 감지한 자막이 초기화되지 않습니다. 기존 자막의 5분 보관 시간은 유지됩니다.</p></li>
      </ul>
      <p class="hint">열려 있던 LMS 탭에는 새 버전을 자동으로 다시 연결했습니다. 조회가 되지 않으면 해당 탭을 새로고침해 주세요.</p>
